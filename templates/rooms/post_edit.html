{% extends 'base.html' %}
{% block title %}Sửa Bảng tin — RTMS{% endblock %}
{% block page_title %}Sửa Thông báo{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <h6 class="fw-bold text-primary mb-0"><i class="bi bi-pencil-square me-2"></i>Chỉnh sửa bài viết</h6>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Tiêu đề <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control" value="{{ post.title }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Nội dung <span class="text-danger">*</span></label>
                        <textarea name="content" class="form-control" rows="8" required>{{ post.content }}</textarea>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'post_list' %}" class="btn btn-outline-secondary">Hủy bỏ</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-1"></i> Lưu thay đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
