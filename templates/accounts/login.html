<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — RTMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #1e293b 0%, #2563eb 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%; max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-logo {
            width: 60px; height: 60px;
            background: #2563eb;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.75rem; color: white; margin: 0 auto 1rem;
        }
        .login-title { font-size: 1.5rem; font-weight: 700; color: #1e293b; }
        .login-sub { color: #64748b; font-size: 0.875rem; }
        .form-label { font-weight: 500; font-size: 0.875rem; color: #374151; }
        .form-control {
            border-color: #d1d5db; border-radius: 8px;
            padding: 0.65rem 1rem; font-size: 0.875rem;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .btn-login {
            background: #2563eb; border: none; color: white;
            width: 100%; padding: 0.75rem; border-radius: 8px;
            font-weight: 600; font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #1d4ed8; }
        .demo-info {
            background: #f0f9ff; border: 1px solid #bae6fd;
            border-radius: 8px; padding: 0.75rem 1rem;
            font-size: 0.8rem; color: #0369a1;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="text-center mb-3">
        <div class="login-logo"><i class="bi bi-house-door-fill"></i></div>
        <h1 class="login-title">RTMS</h1>
        <p class="login-sub">Hệ thống Quản lý Tiền Trọ</p>
    </div>

    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger py-2 mb-3" style="font-size:0.85rem">
            <i class="bi bi-exclamation-circle me-1"></i> {{ message }}
        </div>
        {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label" for="username">Tên đăng nhập</label>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="Nhập tên đăng nhập"
                   value="{{ request.POST.username|default:'' }}" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Mật khẩu</label>
            <div class="position-relative">
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Nhập mật khẩu" required>
                <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y pe-3"
                        style="color:#94a3b8"
                        onclick="togglePwd()">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                </button>
            </div>
        </div>
        <button type="submit" class="btn-login">
            <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
        </button>
    </form>

    <div class="demo-info mt-3">
        <strong><i class="bi bi-info-circle me-1"></i>Tài khoản demo:</strong><br>
        Chủ trọ: <code>owner1</code> / <code>demo1234</code>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePwd() {
    const pwd = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye';
    }
}
</script>
</body>
</html>
